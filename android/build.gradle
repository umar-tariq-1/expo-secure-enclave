plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.secureenclave'
version = '0.2.0'

android {
  namespace "expo.modules.secureenclave"
  defaultConfig {
    versionCode 1
    versionName "0.2.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.biometric:biometric:1.1.0"
}
